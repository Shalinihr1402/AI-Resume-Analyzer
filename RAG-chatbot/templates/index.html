<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF Q&A Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
    <meta name="description" content="Upload PDFs and ask questions – answers are generated from your documents and a powerful LLM.">
</head>
<body>
    <section class="hero">
        <h1>PDF Knowledge Assistant</h1>
        <p>Upload a PDF, then ask anything – the AI will answer using the document and its own knowledge.</p>
    </section>
    <section class="upload-section">
        <h2>1️⃣ Upload your PDF</h2>
        <form id="upload-form" enctype="multipart/form-data">
            <input type="file" name="pdf" accept="application/pdf" required />
            <button type="submit">Upload</button>
        </form>
        <div id="upload-result" class="result"></div>
    </section>
    <section class="qa-section" style="display:none;">
        <h2>2️⃣ Ask a question</h2>
        <div class="chat-box" id="chat-box"></div>
        <form id="question-form">
            <input type="text" name="question" placeholder="Enter your question..." required />
            <button type="submit">Send</button>
        </form>
    </section>

    <script>
        const uploadForm = document.getElementById('upload-form');
        const uploadResult = document.getElementById('upload-result');
        const qaSection = document.querySelector('.qa-section');
        const chatBox = document.getElementById('chat-box');
        const questionForm = document.getElementById('question-form');

        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(uploadForm);
            const res = await fetch('/upload', { method: 'POST', body: formData });
            const data = await res.json();
            if (data.message) {
                uploadResult.textContent = data.message;
                qaSection.style.display = 'block';
            } else {
                uploadResult.textContent = data.error || 'Upload failed';
            }
        });

        questionForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const form = new FormData(questionForm);
            const question = form.get('question');
            if (!question) return;
            // Show user message
            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.textContent = question;
            chatBox.appendChild(userMsg);
            // Clear input
            questionForm.reset();
            // Call backend
            const res = await fetch('/ask', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question })
            });
            const data = await res.json();
            const botMsg = document.createElement('div');
            botMsg.className = 'message bot';
            botMsg.textContent = data.answer || data.error || 'No response';
            chatBox.appendChild(botMsg);
            chatBox.scrollTop = chatBox.scrollHeight;
        });
    </script>
</body>
</html>
